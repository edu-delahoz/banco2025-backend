spring.application.name=banco2025
# Render/Heroku inyectan PORT; en local se usa 8080
server.port=${PORT:8080}

# Base de datos MySQL 8 (la BD "banco2025" debe existir; ver docker-compose.yml o README)
spring.datasource.url=jdbc:mysql://localhost:3306/banco2025?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# Sin dialecto fijo: Hibernate lo detecta (MySQL en local, PostgreSQL en Render)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG

# Transacciones
spring.transaction.default-timeout=30
spring.transaction.rollback-on-commit-failure=true

# Negociación de contenido (respuestas JSON por defecto)
spring.mvc.contentnegotiation.favor-path-extension=false
spring.mvc.contentnegotiation.favor-parameter=false
spring.mvc.contentnegotiation.media-types.json=application/json
